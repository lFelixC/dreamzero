[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-utils"
version = "0.1.0"
description = "Lightweight websocket client/server helpers for DreamZero real-robot eval."
requires-python = ">=3.10"
dependencies = [
    "openpi-client==0.1.1",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
sim = [
    "gymnasium",
    "mediapy",
    "numpy",
    "opencv-python",
    "pillow",
    "torch",
    "tqdm",
    "tyro",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
